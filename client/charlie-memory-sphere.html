      const linkCount = root.querySelector(&#x27;.cms-link-count&#x27;);
      const lodCopy = root.querySelector(&#x27;.cms-lod&#x27;);
      const reduceMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
      const MAX_RENDER_NODES = 7000;
      const SEARCH_DURATION = 5200;
      const SEARCH_STEP_DELAY = 58;
      const THEMES = {
        gold: {
          accent: &#x27;#ffb22d&#x27;, bright: &#x27;#ffe7a1&#x27;, dim: &#x27;#8d5a14&#x27;, ambient: &#x27;rgba(97,53,8,.22)&#x27;, shadow: &#x27;rgba(255,178,45,.75)&#x27;,
          primary: [255, 171, 35], light: [255, 239, 183], hot: [255, 252, 229], deep: [102, 40, 3]
        },
        red: {
          accent: &#x27;#b94f5d&#x27;, bright: &#x27;#e7b8b5&#x27;, dim: &#x27;#6f2533&#x27;, ambient: &#x27;rgba(74,13,25,.25)&#x27;, shadow: &#x27;rgba(185,79,93,.62)&#x27;,
          primary: [176, 55, 73], light: [224, 154, 158], hot: [250, 225, 218], deep: [57, 4, 16]
        },
        blue: {
          accent: &#x27;#6682b9&#x27;, bright: &#x27;#c6d5eb&#x27;, dim: &#x27;#314a78&#x27;, ambient: &#x27;rgba(18,38,77,.27)&#x27;, shadow: &#x27;rgba(102,130,185,.62)&#x27;,
          primary: [76, 107, 170], light: [166, 190, 226], hot: [226, 235, 248], deep: [7, 22, 53]
        },
        purple: {
          accent: &#x27;#8f70ad&#x27;, bright: &#x27;#d8c8e4&#x27;, dim: &#x27;#51366c&#x27;, ambient: &#x27;rgba(52,25,72,.27)&#x27;, shadow: &#x27;rgba(143,112,173,.62)&#x27;,
          primary: [126, 88, 161], light: [196, 175, 216], hot: [239, 230, 246], deep: [36, 12, 51]
        },
        green: {
          accent: &#x27;#4b9478&#x27;, bright: &#x27;#bdd9ca&#x27;, dim: &#x27;#285f4a&#x27;, ambient: &#x27;rgba(10,58,41,.27)&#x27;, shadow: &#x27;rgba(75,148,120,.62)&#x27;,
          primary: [49, 132, 97], light: [151, 197, 174], hot: [222, 239, 229], deep: [4, 47, 31]
        }
      };

      let width = 0;
      let height = 0;
      let dpr = 1;
      let memoryCount = 48;
      let renderNodeCount = 520;
      let desiredLinkCount = 0;
      let nodes = [];
      let nodeSprites = [];
      let edges = [];
      let edgeBuckets = [[], [], [], []];
      let motes = [];
      let rotationY = .15;
      let rotationX = -.12;
      let speaking = false;
      let searchPath = [];
      let searchSegments = [];
      let searchNodes = new Set();
      let searchUntil = 0;
      let palette = THEMES.gold;
      let radiusBoost = 0;
      let targetBoost = 0;
      let lastTime = performance.now();
      let lastRenderedTime = 0;
      let memoryInputTimer = 0;
      let vertexInputTimer = 0;

      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      function rgba(rgb, alpha) {
        return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
      }

      function shade(rgb, factor) {
        return rgb.map(channel =&gt; Math.max(0, Math.min(255, Math.round(channel * factor))));
      }

      function setTheme(name) {
        palette = THEMES[name] || THEMES.gold;
        root.style.setProperty(&#x27;--cms-accent&#x27;, palette.accent);
        root.style.setProperty(&#x27;--cms-bright&#x27;, palette.bright);
        root.style.setProperty(&#x27;--cms-dim&#x27;, palette.dim);
        root.style.setProperty(&#x27;--cms-ambient&#x27;, palette.ambient);
        root.style.setProperty(&#x27;--cms-accent-shadow&#x27;, palette.shadow);
        root.style.setProperty(&#x27;--cms-accent-focus&#x27;, rgba(palette.primary, .16));
        themeSelect.value = THEMES[name] ? name : &#x27;gold&#x27;;
        buildNodeSprites();
      }

      function buildNodeSprites() {
        nodeSprites = Array.from({ length: 6 }, (_, index) =&gt; {
          const sprite = document.createElement(&#x27;canvas&#x27;);
          sprite.width = 72;
          sprite.height = 72;
          const spriteCtx = sprite.getContext(&#x27;2d&#x27;);
          const glowStrength = .13 + index * .018;
          const glow = spriteCtx.createRadialGradient(36, 36, 2, 36, 36, 34);
          glow.addColorStop(0, rgba(palette.light, glowStrength));
          glow.addColorStop(.34, rgba(palette.primary, glowStrength * .6));
          glow.addColorStop(1, rgba(palette.primary, 0));
          spriteCtx.fillStyle = glow;
          spriteCtx.fillRect(0, 0, 72, 72);

          const coreRadius = 8.5 + index * .38;
          const core = spriteCtx.createRadialGradient(33, 32, .5, 36, 36, coreRadius);
          core.addColorStop(0, rgba(palette.hot, .98));
          core.addColorStop(.32, rgba(palette.light, .96));
          core.addColorStop(.68, rgba(palette.primary, .92));
          core.addColorStop(1, rgba(palette.deep, .92));
          spriteCtx.fillStyle = core;
          spriteCtx.beginPath();
          spriteCtx.arc(36, 36, coreRadius, 0, Math.PI * 2);
          spriteCtx.fill();
          return sprite;
        });
      }

      function makeNode(index, total, isNew = false) {
        const y = 1 - (index / Math.max(1, total - 1)) * 2;
        const radial = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = goldenAngle * index + Math.sin(index * 2.31) * .12;
        const distribution = ((index * 37) % 97) / 96;
        const depth = index % 3 === 0
          ? .2 + distribution * .5
          : .7 + distribution * .28;
        return {
          x: Math.cos(theta) * radial * depth,
          y: y * depth,
          z: Math.sin(theta) * radial * depth,
          size: 1.4 + ((index * 13) % 7) * .27,
          heat: .35 + ((index * 23) % 17) / 25,
          glow: .05 + ((index * 29) % 13) / 90,
          voiceReach: index % 6 === 0 ? .03 : .22 + ((index * 19) % 17) / 21,
          voicePhase: (index * 1.618) % (Math.PI * 2),
          lightShift: .16 + ((index * 31) % 11) / 28,
          born: isNew ? performance.now() : 0,
          sourceX: 0,
          sourceY: 0,
          sourceZ: 0,
          category: index % 9
        };
      }

      function seedGraph(count = 48) {
        memoryCount = Math.max(1, Math.min(100000, Math.round(count)));
        const visualCount = Math.min(memoryCount, renderNodeCount, MAX_RENDER_NODES);
        nodes = Array.from({ length: visualCount }, (_, i) =&gt; makeNode(i, visualCount));
        rebuildEdges();
        motes = Array.from({ length: 75 }, (_, i) =&gt; ({
          angle: Math.random() * Math.PI * 2,
          orbit: .2 + Math.random() * .95,
          z: -1 + Math.random() * 2,
          speed: .05 + Math.random() * .1,
          size: .35 + Math.random() * .75,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function rebuildEdges() {
        edges = [];
        edgeBuckets = [[], [], [], []];
        const seen = new Set();
        const count = nodes.length;
        const maximumUnique = count &gt; 1 ? count * (count - 1) / 2 : 0;
        const density = count &lt; 120 ? 3.25 : count &lt; 1000 ? 2.2 : 1.35;
        desiredLinkCount = Math.min(100000, maximumUnique, Math.round(count * density));
        const target = desiredLinkCount;

        const addEdge = (i, j) =&gt; {
          if (i === j) return;
          const a = Math.min(i, j), b = Math.max(i, j);
          const key = a * count + b;
          if (seen.has(key)) return;
          seen.add(key);
          const nodeA = nodes[a], nodeB = nodes[b];
          const dist = Math.hypot(nodeA.x - nodeB.x, nodeA.y - nodeB.y, nodeA.z - nodeB.z);
          const bucket = (a * 17 + b * 23) &amp; 3;
          const edge = {
            a,
            b,
            weight: 1 - Math.min(1, dist / 1.7),
            thickness: .3 + bucket * .34 + ((a * 7 + b * 13) % 7) / 30,
            voicePhase: ((a * 11 + b * 7) % 31) / 31 * Math.PI * 2,
            bucket
          };
          edges.push(edge);
          edgeBuckets[bucket].push(edge);
        };

        const coverageEdges = Math.min(target, count);
        const localJump = Math.max(2, Math.round(Math.sqrt(count || 1)));
        for (let k = 0; k &lt; coverageEdges; k++) {
          const i = Math.floor(k * count / Math.max(1, coverageEdges));
          addEdge(i, (i + localJump + (k % 3)) % count);
        }

        let randomState = (count * 2654435761 + desiredLinkCount * 1597334677) &gt;&gt;&gt; 0;
        const nextRandom = () =&gt; {
          randomState ^= randomState &lt;&lt; 13;
          randomState ^= randomState &gt;&gt;&gt; 17;
          randomState ^= randomState &lt;&lt; 5;
          return randomState &gt;&gt;&gt; 0;
        };

        let attempts = 0;
        const attemptLimit = target * 8 + 2000;
        while (edges.length &lt; target &amp;&amp; attempts &lt; attemptLimit) {
          addEdge(nextRandom() % count, nextRandom() % count);
          attempts += 1;
        }

        if (edges.length &lt; target) {
          for (let a = 0; a &lt; count &amp;&amp; edges.length &lt; target; a++) {
            for (let b = a + 1; b &lt; count &amp;&amp; edges.length &lt; target; b++) addEdge(a, b);
          }
        }
        updateCounters();
      }

      function updateCounters() {
        nodeCount.textContent = memoryCount.toLocaleString(&#x27;ru-RU&#x27;);
        linkCount.textContent = edges.length.toLocaleString(&#x27;ru-RU&#x27;);
        memoryInput.value = String(memoryCount);
        vertexInput.value = String(renderNodeCount);
        if (nodes.length === 0) {
          lodCopy.textContent = &#x27;Отрисовка вершин выключена&#x27;;
        } else if (memoryCount &gt; nodes.length) {
          const perNode = Math.ceil(memoryCount / nodes.length);
          lodCopy.textContent = `Одна вершина ≈ ${perNode.toLocaleString(&#x27;ru-RU&#x27;)} воспоминаний`;
        } else {
          lodCopy.textContent = &#x27;Каждая вершина — одно воспоминание&#x27;;
        }
      }

      function setMemoryCount(value) {
        const count = Math.max(1, Math.min(100000, Math.round(Number(value) || 48)));
        memoryCount = count;
        const visualCount = Math.min(memoryCount, renderNodeCount, MAX_RENDER_NODES);
        nodes = Array.from({ length: visualCount }, (_, i) =&gt; makeNode(i, visualCount));
        clearSearch();
        rebuildEdges();
        stateCopy.textContent = &#x27;Структура памяти обновлена&#x27;;
        window.setTimeout(() =&gt; {
          if (!speaking &amp;&amp; performance.now() &gt; searchUntil) stateCopy.textContent = &#x27;Спокойное состояние&#x27;;
        }, 1600);
      }

      function setRenderNodeCount(value) {
        renderNodeCount = Math.max(0, Math.min(MAX_RENDER_NODES, Math.round(Number(value) || 0)));
        const visualCount = Math.min(memoryCount, renderNodeCount);
        nodes = Array.from({ length: visualCount }, (_, i) =&gt; makeNode(i, visualCount));
        clearSearch();
        rebuildEdges();
        stateCopy.textContent = visualCount
          ? `Отрисовано ${visualCount.toLocaleString(&#x27;ru-RU&#x27;)} вершин`
          : &#x27;Отрисовка вершин выключена&#x27;;
        window.setTimeout(() =&gt; {
          if (!speaking &amp;&amp; performance.now() &gt; searchUntil) stateCopy.textContent = &#x27;Спокойное состояние&#x27;;
        }, 1800);
      }

      function resize() {
        const rect = stage.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function rotatePoint(p) {
        const cy = Math.cos(rotationY), sy = Math.sin(rotationY);
        const cx = Math.cos(rotationX), sx = Math.sin(rotationX);
        const x1 = p.x * cy - p.z * sy;
        const z1 = p.x * sy + p.z * cy;
        const y1 = p.y * cx - z1 * sx;
        const z2 = p.y * sx + z1 * cx;
        return { x: x1, y: y1, z: z2 };
      }

      function project(p, scale) {
        const camera = 3.6;
        const denominator = Math.max(.2, camera - (Number.isFinite(p.z) ? p.z : 0));
        const perspective = camera / denominator;
        return {
          x: width * .5 + p.x * scale * perspective,
          y: height * .5 + 8 + p.y * scale * perspective,
          z: p.z,
          perspective
        };
      }

      function clearSearch() {
        searchPath = [];
        searchSegments = [];
        searchNodes = new Set();
        searchUntil = 0;
      }

      function pathHasEdge(a, b) {
        for (let i = 0; i &lt; searchSegments.length; i++) {
          const segment = searchSegments[i];
          if ((segment.a === a &amp;&amp; segment.b === b) || (segment.a === b &amp;&amp; segment.b === a)) return segment.order;
        }
        return 0;
      }

      function safeRadius(value, minimum = .001) {
        return Number.isFinite(value) ? Math.max(minimum, Math.abs(value)) : minimum;
      }

      function drawGlow(x, y, radius, alpha) {
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        const safeR = safeRadius(radius);
        const g = ctx.createRadialGradient(x, y, 0, x, y, safeR);
        g.addColorStop(0, rgba(palette.light, alpha));
        g.addColorStop(.25, rgba(palette.primary, alpha * .48));
        g.addColorStop(1, rgba(palette.primary, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, safeR, 0, Math.PI * 2);
        ctx.fill();
      }

      function addMemory(auto = false) {
        if (memoryCount &gt;= 100000) return;
        memoryCount += 1;
        const allowedVisible = Math.min(memoryCount, renderNodeCount, MAX_RENDER_NODES);
        if (nodes.length &lt; allowedVisible) {
          const i = nodes.length;
          const fresh = makeNode(i, i + 1, true);
          const y = -1 + Math.random() * 2;
          const theta = Math.random() * Math.PI * 2;
          const radial = Math.sqrt(Math.max(0, 1 - y * y));
          const shell = .22 + Math.cbrt(Math.random()) * .76;
          fresh.x = Math.cos(theta) * radial * shell;
          fresh.y = y * shell;
          fresh.z = Math.sin(theta) * radial * shell;
          nodes.push(fresh);
          rebuildEdges();
        } else if (nodes.length) {
          const representative = nodes[Math.floor(Math.random() * nodes.length)];
          representative.born = performance.now();
          updateCounters();
        } else {
          updateCounters();
        }
        targetBoost = Math.min(36, targetBoost + 4.5);
        stateCopy.textContent = &#x27;Новая память сохранена&#x27;;
        window.setTimeout(() =&gt; {
          if (!speaking &amp;&amp; performance.now() &gt; searchUntil) stateCopy.textContent = &#x27;Спокойное состояние&#x27;;
        }, auto ? 1700 : 2300);
      }

      function setSpeaking(value, auto = false) {
        speaking = value;
        speakButton.setAttribute(&#x27;aria-pressed&#x27;, String(value));
        stateCopy.textContent = value ? &#x27;Чарли говорит&#x27; : &#x27;Спокойное состояние&#x27;;
        if (auto &amp;&amp; value) window.setTimeout(() =&gt; setSpeaking(false, true), 3600);
      }

      function findPath() {
        if (nodes.length &lt; 8) return;
        const start = Math.floor(Math.random() * nodes.length);
        const adjacency = nodes.map(() =&gt; []);
        const stride = Math.max(1, Math.floor(edges.length / 6000));
        for (let i = 0; i &lt; edges.length; i += stride) {
          const edge = edges[i];
          adjacency[edge.a].push(edge.b);
          adjacency[edge.b].push(edge.a);
        }
        const targetSegments = Math.min(
          nodes.length - 1,
          72,
          Math.max(18, Math.round(Math.sqrt(Math.max(1, edges.length)) * 2.6))
        );
        const visited = new Set([start]);
        const queue = [start];
        const segments = [];
        while (queue.length &amp;&amp; segments.length &lt; targetSegments) {
          const current = queue.shift();
          const options = adjacency[current].slice().sort(() =&gt; Math.random() - .5);
          for (const next of options) {
            if (visited.has(next)) continue;
            visited.add(next);
            queue.push(next);
            segments.push({ a: current, b: next, order: segments.length + 1 });
            if (segments.length &gt;= targetSegments) break;
          }
        }
        searchSegments = segments;
        searchNodes = visited;
        searchPath = Array.from(visited);
        searchUntil = performance.now() + SEARCH_DURATION;
        stateCopy.textContent = `Ищу связи: ${segments.length} активных линий`;
      }

      function draw(time) {
        const frameInterval = nodes.length &gt; 5000 || edges.length &gt; 60000
          ? 42
          : nodes.length &gt; 2500 || edges.length &gt; 20000
            ? 32
            : nodes.length &gt; 1200 || edges.length &gt; 8000
              ? 24
              : 0;
        if (frameInterval &amp;&amp; time - lastRenderedTime &lt; frameInterval) {
          requestAnimationFrame(draw);
          return;
        }
        lastRenderedTime = time;
        const dt = Math.min(40, time - lastTime);
        lastTime = time;
        if (!reduceMotion) {
          rotationY += dt * (speaking ? .00018 : .000085);
          rotationX = -.12 + Math.sin(time * .00009) * .055;
        }
        radiusBoost += (targetBoost - radiusBoost) * .018;
        targetBoost *= .9995;

        ctx.clearRect(0, 0, width, height);
        const memoryGrowth = Math.min(34, Math.log10(memoryCount + 1) * 6.8);
        const baseScale = Math.min(width, height) * .29 + memoryGrowth + radiusBoost;
        const cx = width * .5;
        const cy = height * .5 + 8;

        const voice = speaking ? .58 + Math.sin(time * .009) * .24 + Math.sin(time * .021) * .13 : 0;
        drawGlow(cx, cy, baseScale * (.82 + voice * .05), .055 + voice * .055);

        const projected = nodes.map((node, index) =&gt; {
          let p = { x: node.x, y: node.y, z: node.z };
          if (node.born) {
            const age = Math.min(1, (time - node.born) / 1700);
            const eased = 1 - Math.pow(1 - age, 3);
            p = { x: p.x * eased, y: p.y * eased, z: p.z * eased };
            if (age &gt;= 1) node.born = 0;
          }
          if (speaking) {
            const localWave = .5 + .5 * Math.sin(time * .0085 + node.voicePhase);
            const radialPulse = 1 + voice * .035 + localWave * node.voiceReach * .105;
            p = { x: p.x * radialPulse, y: p.y * radialPulse, z: p.z * radialPulse };
          }
          const rotated = rotatePoint(p);
          return { ...project(rotated, baseScale), node, nodeIndex: index, rotated };
        });

        const isSearching = time &lt; searchUntil;
        const edgeDensityFactor = Math.max(.08, Math.sqrt(900 / Math.max(900, edges.length)));
        const nodeDensityFactor = Math.max(.46, Math.sqrt(150 / Math.max(150, nodes.length)));
        if (!isSearching &amp;&amp; searchSegments.length) {
          clearSearch();
          if (!speaking) stateCopy.textContent = &#x27;Спокойное состояние&#x27;;
        }

        if (edges.length &gt; 4000) {
          edgeBuckets.forEach((bucketEdges, bucket) =&gt; {
            const bucketVoice = speaking ? .5 + .5 * Math.sin(time * .009 + bucket * 1.37) : 0;
            const alpha = Math.max(.006, (.055 + bucket * .009) * edgeDensityFactor * (1 + bucketVoice * .72));
            ctx.strokeStyle = rgba(shade(palette.primary, .86 + bucket * .055), alpha);
            ctx.lineWidth = (.28 + bucket * .31) * (1 + bucketVoice * .58);
            ctx.beginPath();
            bucketEdges.forEach((edge) =&gt; {
              const a = projected[edge.a], b = projected[edge.b];
              if (!a || !b) return;
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
            });
            ctx.stroke();
          });

          if (isSearching) {
            for (const segment of searchSegments) {
              if ((time - (searchUntil - SEARCH_DURATION)) &lt;= segment.order * SEARCH_STEP_DELAY) continue;
              const a = projected[segment.a], b = projected[segment.b];
              if (!a || !b) continue;
              ctx.strokeStyle = rgba(palette.light, .9);
              ctx.lineWidth = 1.8;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
              const t = ((time * .0017) + segment.order * .11) % 1;
              drawGlow(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 12, .35);
            }
          }
        } else {
          edges.forEach((edge) =&gt; {
            const a = projected[edge.a], b = projected[edge.b];
            if (!a || !b) return;
            const depth = Math.max(0, Math.min(1, (a.z + b.z + 2) / 4));
            const sequence = isSearching ? pathHasEdge(edge.a, edge.b) : 0;
            const sequenceOn = sequence &amp;&amp; (time - (searchUntil - SEARCH_DURATION)) &gt; sequence * SEARCH_STEP_DELAY;
            const edgeVoice = speaking ? .5 + .5 * Math.sin(time * .009 + edge.voicePhase) : 0;
            const alpha = sequenceOn ? .88 : (.045 + depth * .13 + edge.weight * .08) * (1 + edgeVoice * .9) * edgeDensityFactor;
            ctx.strokeStyle = sequenceOn ? rgba(palette.light, alpha) : rgba(palette.primary, alpha);
            ctx.lineWidth = sequenceOn ? 1.7 : (.18 + edge.thickness * (.34 + depth * .5)) * (1 + edgeVoice * .75);
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            if (sequenceOn) {
              const t = ((time * .0014) + sequence * .19) % 1;
              drawGlow(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 12, .35);
            }
          });
        }

        motes.forEach((mote) =&gt; {
          mote.angle += mote.speed * dt * .001;
          const p = rotatePoint({
            x: Math.cos(mote.angle) * mote.orbit,
            y: Math.sin(mote.angle * 1.7 + mote.phase) * .65,
            z: mote.z
          });
          const s = project(p, baseScale);
          const alpha = .07 + Math.max(0, p.z + 1) * .08;
          ctx.fillStyle = rgba(palette.light, alpha * .82);
          ctx.beginPath();
          ctx.arc(s.x, s.y, safeRadius(mote.size * s.perspective), 0, Math.PI * 2);
          ctx.fill();
        });

        projected.sort((a, b) =&gt; a.z - b.z).forEach((p, sortedIndex) =&gt; {
          const depth = Math.max(0, Math.min(1, (p.z + 1.1) / 2.2));
          const nodeVoice = speaking ? .5 + .5 * Math.sin(time * .009 + p.node.voicePhase) : 0;
          const r = p.node.size * (.82 + depth * .92) * p.perspective * (1 + nodeVoice * .35) * nodeDensityFactor;
          const safeR = safeRadius(r, .8);
          const sprite = nodeSprites[Math.min(nodeSprites.length - 1, Math.max(0, Math.floor(depth * nodeSprites.length)))];
          const drawSize = safeR * (7.6 + p.node.glow * 7);
          ctx.globalAlpha = .6 + depth * .4;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");

    );

      throw new TypeError(

        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

    storage = null;
  }

    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }

      }

        Number.isFinite(height) &&

    "load",
    () => {

        { type: "codex-visualization-initialize" },

  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
